version: "3.8"

services:
  db:
    image: postgres:18.3-alpine3.23
    container_name: shopping_cart_api
    restart: unless-stopped

    environment:
      POSTGRES_DB: shopping_cart_DB
      POSTGRES_USER: root
      POSTGRES_PASSWORD: thuan2005@
    ports:
      - "5432:5432"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
volumes:
  pgdata:
